[package]
name = "ghfs"
version = "0.1.4"
edition = "2024"
description = "Mount GitHub repositories as a local filesystem"
license = "MIT"
repository = "https://github.com/rgodha24/ghfs"
homepage = "https://github.com/rgodha24/ghfs"
readme = "README.md"

[lib]
name = "ghfs"
path = "src/lib.rs"

[[bin]]
name = "ghfs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dashmap = "6"
dirs = "6"
env_logger = "0.11"
git2 = { version = "0.19", default-features = false }
libc = "0.2"
log = "0.4"
lru = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.15", default-features = false, features = ["abi-7-19"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
